[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wifite-pipeline"
version = "0.1.0"
description = "Orquestrador que transforma o wifite num pipeline paralelo: captura -> quebra -> resultado -> conexao, em 4 paineis tmux."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Fabio Prota", email = "jiujitsuterra@hotmail.com" }]
keywords = ["wifi", "wpa", "handshake", "pmkid", "wifite", "pentest", "hashcat", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

# Nenhuma dependencia externa obrigatoria: o projeto usa apenas a biblioteca
# padrao do Python. As ferramentas que ele orquestra (wifite, hashcat,
# aircrack-ng, hcxtools, nmcli) sao binarios do sistema, verificados em
# tempo de execucao pelo comando `wp doctor`.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov", "ruff"]

[project.scripts]
wp = "wifite_pipeline.cli:main"

[project.urls]
Homepage = "https://github.com/fabioprota-0/wifite-pipeline"
Issues = "https://github.com/fabioprota-0/wifite-pipeline/issues"

[tool.setuptools]
packages = ["wifite_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
# 3.10+ permite `list[str]` e `str | None` nativamente, sem depender do
# `from __future__ import annotations`. Kali Linux ja traz 3.11 ou mais novo.
target-version = "py310"

[tool.ruff.lint]
# Conjunto DECLARADO de proposito. Sem isto, o ruff usa um padrao que muda
# entre versoes: uma atualizacao do linter passaria a reprovar codigo que
# antes passava, e a CI quebraria sozinha sem ninguem mexer em nada.
select = [
    "E4", "E7", "E9",   # pycodestyle: erros reais de sintaxe/indentacao
    "W",                # pycodestyle: avisos
    "F",                # pyflakes: codigo morto, nome indefinido, import sobrando
    "I",                # isort: ordem e agrupamento de imports
    "UP",               # pyupgrade: sintaxe obsoleta para a versao alvo
    "B",                # bugbear: armadilhas comuns do Python
    "C4",               # comprehensions simplificaveis
    "SIM",              # simplificacoes de expressao
    "PIE",              # problemas diversos
    "RUF",              # regras do proprio ruff
]
ignore = [
    # E501 (linha longa) e incompativel com `ruff format` em strings longas:
    # o formatador nao quebra strings, entao a regra acusa o que ele nao
    # consegue consertar. O limite de 100 colunas acima continua valendo como
    # guia para codigo.
    "E501",
]
