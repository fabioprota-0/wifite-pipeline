name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    name: unittest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 e o minimo suportado; 3.12 e o que a Kali atual usa.
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Confirmar que nao ha dependencias externas
        run: |
          python - <<'EOF'
          import tomllib, pathlib, sys
          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          deps = data["project"].get("dependencies", [])
          if deps:
              sys.exit(f"ERRO: o projeto deve continuar sem dependencias, achei {deps}")
          print("OK: zero dependencias de runtime")
          EOF
        if: matrix.python-version != '3.9'

      - name: Checar sintaxe de todos os modulos
        run: python -m compileall -q wifite_pipeline scripts

      - name: Rodar a suite de testes
        run: python -m unittest discover -s tests -t . -v

      - name: Rodar a demonstracao sem hardware
        # A demo exercita watcher, fila, cache, import/export e a UI de ponta a
        # ponta. Se ela passa, o encanamento esta integro.
        run: python scripts/demo.py --workdir "$RUNNER_TEMP/wp-demo"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar ruff
        run: pip install ruff
      - name: Checar estilo
        run: ruff check wifite_pipeline scripts tests
